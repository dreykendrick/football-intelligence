name: Football Intelligence System CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-policy:
    name: Codebase Lint Policy (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Report Ruff Lint Statistics
        continue-on-error: true
        run: |
          ruff check backend/app backend/tests --statistics

  postgresql-certification:
    name: PostgreSQL Clean-Chain Migration & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Verify Toolchain & PostgreSQL Service Version
        env:
          PGPASSWORD: postgres
        run: |
          python --version
          alembic --version
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U postgres -d football_intelligence_test -c "SELECT version();"

      - name: Verify Clean Database Precondition (Zero Tables)
        env:
          PGPASSWORD: postgres
        run: |
          TABLE_COUNT=$(psql -h localhost -p 5432 -U postgres -d football_intelligence_test -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "Initial public table count: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -ne "0" ]; then
            echo "ERROR: Clean database expected 0 public tables, found $TABLE_COUNT"
            exit 1
          fi

      - name: Run Alembic Offline SQL Migration Generation
        run: |
          cd backend
          alembic upgrade head --sql > offline_migrations.sql
          grep "CREATE TABLE" offline_migrations.sql | head -n 5

      - name: Execute Clean-Chain Alembic Migrations to Head
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
          DATABASE_URL_OVERRIDE: postgresql://postgres:postgres@localhost:5432/football_intelligence_test
        run: |
          cd backend
          python -c "
          import os, sys
          from alembic.config import Config
          from alembic import command
          import traceback
          cfg = Config('alembic.ini')
          try:
              command.upgrade(cfg, 'head')
              print('Alembic upgrade head succeeded!')
          except Exception as e:
              err_msg = traceback.format_exc()
              print('='*50)
              print('ALEMBIC UPGRADE TRACEBACK:')
              print(err_msg)
              print('='*50)
              sys.stdout.flush()
              with open('alembic_err.txt', 'w') as ef:
                  ef.write(err_msg)
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_file:
                  with open(summary_file, 'a') as sf:
                      sf.write('### Alembic Upgrade Failure\n```\n' + err_msg + '\n```\n')
              sys.exit(1)
          "

      - name: Post Failure to Commit Comment if Migration Fails
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f backend/alembic_err.txt ]; then
            ERROR_BODY=$(cat backend/alembic_err.txt | head -c 4000)
            PAYLOAD=$(jq -n --arg body "### Alembic Migration Failure in CI Run ${{ github.run_id }}
            \`\`\`
            $ERROR_BODY
            \`\`\`" '{"body": $body}')
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
                 -H "Content-Type: application/json" \
                 -d "$PAYLOAD" \
                 "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" || true
          fi
      - name: Upload Alembic Failure Traceback on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alembic-error-traceback
          path: alembic_traceback.txt

      - name: Verify Alembic Migration Head
        env:
          PGPASSWORD: postgres
        run: |
          DB_HEAD=$(psql -h localhost -p 5432 -U postgres -d football_intelligence_test -t -A -c "SELECT version_num FROM alembic_version;")
          echo "Database Alembic revision: $DB_HEAD"
          if [ "$DB_HEAD" != "20260904_0004" ]; then
            echo "ERROR: Database revision ($DB_HEAD) does not match expected repository head (20260904_0004)"
            exit 1
          fi

      - name: Run Targeted PostgreSQL Integration Tests
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
          RUNNING_IN_CI: "true"
        run: |
          cd backend
          pytest -m integration -v

      - name: Run Full Repository Regression Suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
          RUNNING_IN_CI: "true"
        run: |
          cd backend
          pytest -v
