[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-intelligence-backend"
version = "0.1.0"
description = "Scientific Football Intelligence & Probability Analysis System Backend"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Football Intelligence System Team" }
]
keywords = ["sports-analytics", "probability-estimation", "football-data", "fastapi", "sqlalchemy"]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by ruff format)
    "B008", # Do not perform function call `Depends` in argument defaults (idiomatic FastAPI)
    "E402", # Module level import not at top of file (allow sys.path bootstrapping in dev scripts)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database",
    "reproducibility: Test pre-match data snapshot reproducibility",
    "leakage: Verification against temporal data leakage",
]
